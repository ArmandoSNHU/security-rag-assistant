[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secrag"
version = "0.1.0"
description = "Local-first retrieval-augmented assistant for security and compliance documents"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.0"]
ollama = ["requests>=2.31"]
dev = ["pytest>=8.0"]

[project.scripts]
secrag = "secrag.cli:main"

[tool.setuptools]
packages = ["secrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
